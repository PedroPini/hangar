name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  NO_COLOR: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must point to a commit on origin/main"
            exit 1
          fi
      - name: Build and install package
        id: package
        shell: bash
        run: |
          tarball="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          prefix="$RUNNER_TEMP/hangar-install"
          project="$RUNNER_TEMP/project"
          skill="$project/.agents/skills/smoke"
          prompt="$RUNNER_TEMP/prompt.txt"

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

          npm install --prefix "$prefix" "$RUNNER_TEMP/$tarball" --ignore-scripts --no-audit --no-fund
          "$prefix/node_modules/.bin/hangar" --help

          mkdir -p "$skill"
          printf '%s\n' '---' 'name: smoke' 'description: Package smoke test.' '---' > "$skill/SKILL.md"
          printf 'Use' > "$prompt"
          HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home" HANGAR_PROJECT="$project" HANGAR_QUERY=smoke HANGAR_FIRST=1 "$prefix/node_modules/.bin/hangar-editor" "$prompt"
          test "$(cat "$prompt")" = "Use \$smoke"
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/$TARBALL" "dist/$TARBALL"
          (cd dist && sha256sum "$TARBALL" > "$TARBALL.sha256")
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hangar-release-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 7

  required:
    name: Required
    if: ${{ always() }}
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hangar-release-${{ github.sha }}
          path: dist/
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tgz dist/*.sha256)
          if [[ ${#assets[@]} -ne 2 ]]; then
            echo "::error::Expected one tarball and one checksum"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Hangar $GITHUB_REF_NAME"
